name: Auto Unfollow
on:
  schedule:
    # 日本時間 21,22,23時（1日3回）
    # UTCでは 12,13,14時
    - cron: '0 12,13,14 * * *'
  workflow_dispatch:
# いいね・フォローと同時に動かないよう、同じアカウントの処理は順番待ちにする
concurrency:
  group: room-account
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install selenium
      - name: Run script
        timeout-minutes: 60
        env:
          RAKUTEN_CONFIG_JSON: ${{ secrets.RAKUTEN_CONFIG_JSON }}
          ROOM_FOLLOWING_URL: ${{ secrets.ROOM_FOLLOWING_URL }}
        run: python UNFOLLOW.py
      - name: Keep alive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keep alive [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries" >&2
          exit 1

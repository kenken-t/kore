name: Auto Like
on:
  schedule:
    # 日本時間 1:00, 2:00, 3:00, 4:00, 5:00, 6:00, 7:00, 8:00, 9:00, 10:00
    # UTCでは前日の 16, 17, 18, 19, 20, 21, 22, 23, 当日の 0, 1 となります
    - cron: '0 16,17,18,19,20,21,22,23,0,1 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install selenium
      - name: Run script
        timeout-minutes: 20
        env:
          RAKUTEN_CONFIG_JSON: ${{ secrets.RAKUTEN_CONFIG_JSON }}
        run: python GOOD.py
      - name: Keep alive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keep alive [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after retries" >&2
          exit 1
